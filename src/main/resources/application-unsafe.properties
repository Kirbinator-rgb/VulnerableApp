spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# The H2 console is a full database client. Serving it at all exposes every table the
# application owns -- the credential vaults included -- and web-allow-others additionally
# accepted connections from any host rather than just the loopback interface, so it was
# reachable by anyone who could reach the app. The public profile already disables it; the
# unsafe profile was switching it back on.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
